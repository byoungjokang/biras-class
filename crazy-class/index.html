<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미친수업 신청완료 안내</title>
<meta name="description" content="아래 사전 신청서를 작성해주셔야 신청이 최종 완료됩니다.">
<meta property="og:title" content="미친수업 원데이 클래스 패스권 신청완료">
<meta property="og:description" content="사전 신청서를 작성해주셔야 신청이 최종 완료됩니다.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{--bg:#0a0a0a;--red:#b22222;--gold:#f5c542;--text:#fff;--muted:#a6a6a6}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text)}
  body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;word-break:keep-all;line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding:56px 20px 40px;text-align:center}
  .brand{color:var(--muted);font-size:14px;letter-spacing:.08em;margin:0 0 14px}
  h1{margin:0;font-size:40px;font-weight:800;line-height:1.25}
  h1 span{display:block;color:var(--red);font-size:34px}
  .done{margin:18px 0 0;font-size:21px;font-weight:700}
  .bar{width:48px;height:3px;background:var(--red);margin:28px auto 32px}
  .box{border:2px solid var(--red);background:#170c0c;padding:26px 18px 20px}
  .box p{margin:0 0 20px;font-size:17px}
  .box strong{color:var(--gold)}
  .btn{display:block;background:var(--red);color:#fff;text-decoration:none;padding:20px 16px;font-size:20px;font-weight:800;border-radius:4px;transition:background .15s}
  .btn:hover,.btn:active{background:#cf2a2a}
  .btn small{display:block;font-size:13px;font-weight:500;opacity:.85;margin-top:4px}
  .notice{margin:40px 0 0;font-size:16px;color:var(--muted)}
  .notice b{display:block;color:var(--text);font-size:18px;margin-bottom:6px}
  .wait{margin:28px 0 0;border:1px solid #222;border-top:2px solid var(--red);background:#111;padding:22px 16px}
  .wait p{margin:0;color:var(--muted)}
  .wait p+p{color:var(--text);font-weight:700;font-size:17px;margin-top:6px}
  .from{margin:44px 0 0;font-size:20px;font-weight:800}
  footer{margin:56px 0 0;font-size:12px;color:#555}
</style>
</head>
<body>
<main class="wrap">
  <p class="brand">비제이라이프스쿨 비라스</p>
  <h1>미친수업<span>원데이 클래스 패스권</span></h1>
  <p class="done">신청이 완료되셨습니다.</p>
  <div class="bar"></div>

  <section class="box">
    <p>아래 신청서를 꼭! 적어주셔야<br>신청이 <strong>최종적으로 완료</strong>됩니다!</p>
    <a class="btn" href="https://forms.gle/fy4kiwwP1fzhXPwF6" target="_blank" rel="noopener">미친수업 사전 신청서 작성하기<small>눌러서 바로 작성</small></a>
  </section>

  <p class="notice"><b>24시간 이내</b>비제이라이프스쿨 담당자가<br>수업 안내 문자를 카카오톡으로 안내드리오니</p>

  <div class="wait"><p>기다려주시면</p><p>순차적으로 연락드리겠습니다.</p></div>

  <p class="from">비라스 대표 병조쌤</p>
  <footer>서울특별시 강남구 강남대로62길 31 지하 1층<br>kangbyoungjo.co.kr</footer>
</main>
</body>
</html>
